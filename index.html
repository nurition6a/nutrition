<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nutrition AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    .ar-container {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 9999;

      background: white;
      color: black;

      padding: 15px 20px;
      border-radius: 20px;

      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;

      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div class="ar-container">

    <div id="message">
      📷 Point the camera at your nutrition card
    </div>

    <a-scene
      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        uiLoading: no;
        uiScanning: no;
        uiError: no;
        filterMinCF: 0.0005;
        filterBeta: 0.001;
        warmupTolerance: 8;
        missTolerance: 12;
      "
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <!-- CAMERA -->
      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>


      <!-- IMAGE TARGET -->
      <a-entity
        id="target"
        mindar-image-target="targetIndex: 0">

        <!-- TEST CUBE -->
        <a-box
          position="0 0 0.2"
          color="red"
          depth="0.3"
          height="0.3"
          width="0.3">
        </a-box>

      </a-entity>

    </a-scene>

  </div>


  <script>

    const target = document.querySelector("#target");
    const message = document.querySelector("#message");


    // When the card is detected
    target.addEventListener("targetFound", () => {

      message.innerHTML = "✅ TARGET FOUND!";

    });


    // When the card is lost
    target.addEventListener("targetLost", () => {

      message.innerHTML =
        "📷 Point the camera at your nutrition card";

    });

  </script>

</body>
</html>
