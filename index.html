<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nutrition Augmented Reality</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      padding: 12px 20px;
      border-radius: 15px;
      font-size: 18px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>

<body>

  <!-- Message shown before recognizing the image -->
  <div id="message">
    📷 Point the camera at the nutrition image
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- EVERYTHING BELOW APPEARS ONLY WHEN THE IMAGE IS RECOGNIZED -->

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Background -->
      <a-plane
        position="0 0 0"
        width="1.8"
        height="1.2"
        color="#F4F8E8">
      </a-plane>

      <!-- Title -->
      <a-text
        value="NUTRITION"
        position="0 0.48 0.02"
        align="center"
        color="#247A35"
        width="2">
      </a-text>

      <!-- Photosynthesis -->
      <a-text
        value="PHOTOSYNTHESIS"
        position="-0.65 0.25 0.02"
        align="center"
        color="#247A35"
        width="1.1">
      </a-text>

      <a-text
        value="Plants make their own food using sunlight, water, carbon dioxide and minerals."
        position="-0.65 0.05 0.02"
        align="center"
        color="#222222"
        width="0.9"
        wrap-count="28">
      </a-text>

      <!-- Chemosynthesis -->
      <a-text
        value="CHEMOSYNTHESIS"
        position="0.65 0.25 0.02"
        align="center"
        color="#6A3DA8"
        width="1.1">
      </a-text>

      <a-text
        value="Some bacteria obtain energy from chemical substances in their environment."
        position="0.65 0.05 0.02"
        align="center"
        color="#222222"
        width="0.9"
        wrap-count="28">
      </a-text>

      <!-- Heterotrophs -->
      <a-text
        value="HETEROTROPHS"
        position="0 -0.25 0.02"
        align="center"
        color="#D66A18"
        width="1.2">
      </a-text>

      <a-text
        value="Animals and fungi are heterotrophs. Animals eat other organisms, while fungi break down organic matter and absorb nutrients."
        position="0 -0.48 0.02"
        align="center"
        color="#222222"
        width="1.5"
        wrap-count="45">
      </a-text>

    </a-entity>

  </a-scene>

  <script>
    const message = document.getElementById("message");

    const scene = document.querySelector("a-scene");

    scene.addEventListener("targetFound", () => {
      message.style.display = "none";
    });

    scene.addEventListener("targetLost", () => {
      message.style.display = "block";
    });
  </script>

</body>
</html>
