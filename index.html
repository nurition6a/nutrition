<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Nutrition Augmented Reality</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .ar-container {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 9999;

      background: white;
      color: black;

      padding: 14px 22px;

      border-radius: 20px;

      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;

      text-align: center;

      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

  </style>

</head>


<body>

  <div class="ar-container">

    <div id="message">
      📷 Point the camera at the nutrition card
    </div>


    <a-scene

      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        uiLoading: yes;
        uiError: yes;
        uiScanning: yes;
      "

      embedded

      color-space="sRGB"

      renderer="
        colorManagement: true;
        physicallyCorrectLights;
      "

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"

    >


      <!-- CAMERA -->

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>


      <!-- IMAGE TARGET -->

      <a-entity
        id="nutritionTarget"
        mindar-image-target="targetIndex: 0">


        <!-- WHITE INFORMATION PANEL -->

        <a-plane
          position="0 0 0.05"
          width="1.2"
          height="0.8"
          color="#FFFFFF">
        </a-plane>


        <!-- TITLE -->

        <a-text
          value="NUTRITION"
          position="0 0.28 0.1"
          align="center"
          color="#1B5E20"
          width="1.6">
        </a-text>


        <!-- INFORMATION -->

        <a-text
          value="Living things obtain nutrients in different ways.

Autotrophs make their own food.

Plants use photosynthesis.

Some bacteria use chemosynthesis.

Animals and fungi are heterotrophs."
          position="0 0.02 0.1"
          align="center"
          color="#222222"
          width="1.15"
          wrap-count="35"
          line-height="55">
        </a-text>


        <!-- FINAL MESSAGE -->

        <a-text
          value="Good nutrition provides energy and nutrients needed to grow, develop and survive."
          position="0 -0.29 0.1"
          align="center"
          color="#2E7D32"
          width="1.05"
          wrap-count="38"
          line-height="55">
        </a-text>


      </a-entity>


    </a-scene>

  </div>


  <script>

    const target =
      document.querySelector("#nutritionTarget");

    const message =
      document.querySelector("#message");


    /*
     * When the card is detected
     */

    target.addEventListener("targetFound", function () {

      console.log("CARD DETECTED");

      message.innerHTML = "✅ Card detected!";

      setTimeout(function () {
        message.style.display = "none";
      }, 1000);

    });


    /*
     * When the card is no longer detected
     */

    target.addEventListener("targetLost", function () {

      console.log("CARD LOST");

      message.style.display = "block";

      message.innerHTML =
        "📷 Point the camera at the nutrition card";

    });


  </script>


</body>

</html>
