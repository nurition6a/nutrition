<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Nutrition AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .ar-container {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 9999;

      background: white;
      color: black;

      padding: 14px 20px;

      border-radius: 20px;

      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;

      text-align: center;
    }

  </style>

</head>


<body>

  <div class="ar-container">

    <div id="message">
      📷 Point the camera at the nutrition card
    </div>


    <a-scene

      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        uiLoading: no;
        uiError: no;
        uiScanning: no;
      "

      embedded

      color-space="sRGB"

      renderer="
        colorManagement: true;
        physicallyCorrectLights;
      "

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"
    >


      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>


      <!-- TARGET -->

      <a-entity
        id="target"
        mindar-image-target="targetIndex: 0">


        <!-- Simple test object -->

        <a-box
          position="0 0 0.1"
          rotation="0 45 0"
          color="#4CAF50"
          scale="0.3 0.3 0.3">
        </a-box>


      </a-entity>


    </a-scene>

  </div>


  <script>

    const target =
      document.querySelector("#target");

    const message =
      document.querySelector("#message");


    target.addEventListener(
      "targetFound",
      function () {

        console.log("TARGET FOUND");

        message.innerHTML =
          "✅ CARD DETECTED!";

      }
    );


    target.addEventListener(
      "targetLost",
      function () {

        console.log("TARGET LOST");

        message.innerHTML =
          "📷 Point the camera at the nutrition card";

      }
    );

  </script>


</body>

</html>
