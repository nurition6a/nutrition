<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Nutrition Augmented Reality</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #cameraMessage {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      background: rgba(255,255,255,0.95);
      padding: 14px 22px;
      border-radius: 18px;

      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;

      text-align: center;
    }
  </style>
</head>

<body>

  <!-- ONLY this message is visible when the camera starts -->
  <div id="cameraMessage">
    📷 Point the camera at the nutrition card
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
  >


    <!-- CAMERA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!--
      IMPORTANT:

      This entire entity starts HIDDEN.
      It becomes visible ONLY after MindAR
      detects target image 0.
    -->

    <a-entity
      id="nutritionTarget"
      mindar-image-target="targetIndex: 0"
      visible="false"
    >


      <!-- BACKGROUND -->

      <a-plane
        position="0 0 0"
        width="1.8"
        height="1.2"
        color="#F4F8E8">
      </a-plane>


      <!-- TITLE -->

      <a-text
        value="NUTRITION"
        position="0 0.48 0.03"
        align="center"
        color="#247A35"
        width="2">
      </a-text>


      <!-- PHOTOSYNTHESIS -->

      <a-text
        value="PHOTOSYNTHESIS"
        position="-0.55 0.25 0.03"
        align="center"
        color="#247A35"
        width="1.0">
      </a-text>

      <a-text
        value="Plants make their own food using sunlight, water, carbon dioxide and minerals."
        position="-0.55 0.03 0.03"
        align="center"
        color="#222222"
        width="0.8"
        wrap-count="25">
      </a-text>


      <!-- CHEMOSYNTHESIS -->

      <a-text
        value="CHEMOSYNTHESIS"
        position="0.55 0.25 0.03"
        align="center"
        color="#6A3DA8"
        width="1.0">
      </a-text>

      <a-text
        value="Some bacteria obtain energy from chemical substances in their environment."
        position="0.55 0.03 0.03"
        align="center"
        color="#222222"
        width="0.8"
        wrap-count="25">
      </a-text>


      <!-- HETEROTROPHS -->

      <a-text
        value="HETEROTROPHS"
        position="0 -0.28 0.03"
        align="center"
        color="#D66A18"
        width="1.1">
      </a-text>

      <a-text
        value="Animals and fungi cannot make their own food. Animals eat other organisms, while fungi break down organic matter and absorb nutrients."
        position="0 -0.48 0.03"
        align="center"
        color="#222222"
        width="1.35"
        wrap-count="42">
      </a-text>


    </a-entity>

  </a-scene>


  <script>

    const target =
      document.querySelector("#nutritionTarget");

    const message =
      document.querySelector("#cameraMessage");


    /*
      When the image is detected:
      SHOW the augmented information.
    */

    target.addEventListener("targetFound", function () {

      target.setAttribute("visible", "true");

      message.innerHTML =
        "✨ Image detected!";

      setTimeout(function () {
        message.style.display = "none";
      }, 1000);

    });


    /*
      When the image is no longer detected:
      HIDE the augmented information.
    */

    target.addEventListener("targetLost", function () {

      target.setAttribute("visible", "false");

      message.style.display = "block";

      message.innerHTML =
        "📷 Point the camera at the nutrition card";

    });

  </script>

</body>
</html>
