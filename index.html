<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Camera Test</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #camera {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      background: black;
    }

    #message {
      position: fixed;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 10;

      background: white;
      color: black;

      padding: 15px 20px;

      border-radius: 20px;

      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;

      text-align: center;
    }
  </style>

</head>

<body>

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <div id="message">
    📷 Starting camera...
  </div>


  <script>

    const video = document.getElementById("camera");
    const message = document.getElementById("message");


    async function startCamera() {

      try {

        const stream = await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


        video.srcObject = stream;

        message.innerHTML = "✅ CAMERA WORKING";


        console.log("Camera started successfully");

      } catch (error) {

        console.error("Camera error:", error);

        message.innerHTML =
          "❌ Camera error: " + error.name;

      }

    }


    startCamera();

  </script>

</body>

</html>
